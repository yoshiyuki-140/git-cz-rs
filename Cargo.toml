[package]
name = "git-cz-rs"
version = "1.1.0"
edition = "2024"

[workspace.dependencies]
inquire = "0.7"
anyhow = "1.0"
dirs = "5.0"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
indexmap = { version = "2.0", features = ["serde"] }

[dependencies]
anyhow = { workspace = true }
entity = { path = "./crates/entity" }
usecase = { path = "./crates/usecase" }
driver = { path = "./crates/driver" }
adapter = { path = "./crates/adapter" }


[dev-dependencies]
cargo-llvm-cov = "0.9.1"
tempfile = "3"

[workspace]
members = ["crates/adapter", "crates/driver", "crates/entity", "crates/usecase"]
